[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/roushou/omega"
rust-version = "1.85"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[workspace.dependencies]
omega-derive = { path = "crates/omega-derive", version = "0.1.0" }
omega-document = { path = "crates/omega-document", version = "0.1.0" }
omega-proto = { path = "crates/omega-proto", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
