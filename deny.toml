# Dependency policy checked by cargo-deny.

[graph]
all-features = true

[advisories]
# A new advisory against a dependency should fail the build that finds it.
yanked = "deny"

[licenses]
# Allow only reviewed licenses used by current dependencies.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Report duplicate versions without blocking transitive dependency upgrades.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Published packages must resolve dependencies from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
