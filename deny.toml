# cargo-deny: what omega is willing to depend on.

[graph]
all-features = true

[advisories]
# A new advisory against a dependency should fail the build that finds it.
yanked = "deny"

[licenses]
# Exactly the licenses present in the tree. A new one is meant to be a
# decision, not a surprise, so this list is added to deliberately rather than
# stocked with permissive licences nothing depends on yet — an allowance
# nothing matches is warned about, and warnings nobody acts on train people to
# ignore the tool.
allow = [
  "Apache-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Warn, not deny: duplicate versions are normal mid-ecosystem (hashbrown,
# syn, windows-sys all appear twice today) and are somebody else's release
# schedule, not a defect in this workspace.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything comes from crates.io. A git or private-registry dependency would
# not be publishable, which `packaging.rs` also enforces.
unknown-registry = "deny"
unknown-git = "deny"
