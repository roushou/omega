name: ci

# The four checks AGENTS.md requires of a change, run on every one.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # Separate from `check` because it needs Qt rather than a Rust toolchain,
  # and because the renderer is the one part of Omega no compiler sees: the
  # Rust tests pin the props the QML reads and the files it carries, and
  # nothing at all reads the QML.
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-declarative-dev-tools

      - name: Lint the QML
        run: crates/omega-renderer/shell/lint.sh
        env:
          QMLLINT: /usr/lib/qt6/bin/qmllint

  # Separate from `check` so a new advisory against a dependency reads as a
  # supply-chain problem rather than as this workspace's code going red.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear

      - name: Unused dependencies
        run: cargo shear

      - name: Licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
