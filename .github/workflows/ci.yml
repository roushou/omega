name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install platform dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v4
        if: hashFiles('mise.toml') != ''
        with:
          version: 2026.9.1

      - name: Rust checks
        if: hashFiles('mise.toml') != ''
        run: mise run check:rust

      - name: Document and configuration formatting
        if: hashFiles('mise.toml') != ''
        run: mise run check:format

      # Release backfills can target tags that predate mise.toml.
      - name: Rust checks for older tags
        if: hashFiles('mise.toml') == ''
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace --all-targets
          cargo test --workspace

      - name: Minimum supported Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          if [[ -f mise.toml ]]; then
            mise run check:msrv
          else
            cargo +1.88.0 check --workspace --all-targets --locked
          fi

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install QML tooling and runtime modules
        # Unrelated third-party repositories may fail to refresh. Package installation
        # remains mandatory and fails if required Ubuntu packages are unavailable.
        run: |
          sudo apt-get update || true
          sudo apt-get install --no-install-recommends -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml-models qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates

      - uses: jdx/mise-action@v4
        if: hashFiles('mise.toml') != ''
        with:
          version: 2026.9.1

      - name: Renderer checks
        if: hashFiles('mise.toml') != ''
        run: mise run check:renderer
        env:
          QMLLINT: /usr/lib/qt6/bin/qmllint

      - name: Renderer checks for older tags
        if: hashFiles('mise.toml') == ''
        run: |
          crates/omega-renderer/shell/lint.sh
          crates/omega-renderer/shell/test.sh
        env:
          QMLLINT: /usr/lib/qt6/bin/qmllint

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@v4
        if: hashFiles('mise.toml') != ''
        with:
          version: 2026.9.1

      - name: Dependency checks
        if: hashFiles('mise.toml') != ''
        run: mise run check:dependencies

      - uses: taiki-e/install-action@v2
        if: hashFiles('mise.toml') == ''
        with:
          tool: cargo-shear@1.13.4
      - run: cargo shear
        if: hashFiles('mise.toml') == ''
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: hashFiles('mise.toml') == ''

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      # Backfills check the release tooling that runs them, even if the tag predates it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jdx/mise-action@v4
        if: hashFiles('mise.toml') != ''
        with:
          version: 2026.9.1

      - name: Workflow checks
        run: mise run check:workflows
