name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Minimum supported Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        # `update`'s exit code is not the signal, for the same reason
        # qmllint's own is not: it reports on things we did not ask about.
        # The runner image carries third-party apt repos we have no use for —
        # Google Chrome, Microsoft — and when one of their CDNs serves an
        # index that disagrees with its own Release file, `update` exits 100
        # having already fallen back to the indices it had. That failed this
        # job on Chrome's repo while Ubuntu's archive was fetched perfectly.
        #
        # The install below is the real gate: if the archive we actually need
        # is broken, the package does not arrive and the job goes red there,
        # with an error about the package rather than about a browser.
        run: |
          sudo apt-get update || true
          sudo apt-get install --no-install-recommends -y qt6-declarative-dev-tools

      - name: Lint the QML
        run: crates/omega-renderer/shell/lint.sh
        env:
          QMLLINT: /usr/lib/qt6/bin/qmllint

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear

      - name: Unused dependencies
        run: cargo shear

      - name: Licenses, advisories, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2
