[package]
name = "omega-proto"
version.workspace = true
categories = ["encoding", "network-programming", "os::linux-apis"]
edition.workspace = true
homepage.workspace = true
keywords = ["protobuf", "protocol", "ipc", "desktop", "wayland"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Omega's protocol: the protobuf ontology, frame codec, transport, and handshake."

[lints]
workspace = true

# `pbjson` is used only by the serde impls `build.rs` generates, which
# cargo-shear does not see.
[package.metadata.cargo-shear]
ignored = ["pbjson"]

[features]
default = []
# The canonical protobuf JSON mapping: the observation socket's encoding, and
# the only thing in this crate a unit never needs. Off by default so a plugin
# binary does not carry serde impls for the whole ontology to speak a socket
# it never opens.
json = ["dep:pbjson", "dep:serde_json"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
pbjson = { version = "0.9", optional = true }
prost = "0.14"
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = "0.10"
socket2 = "0.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
omega-proto = { path = ".", features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[build-dependencies]
prost-build = "0.14"
pbjson-build = "0.9"
protoc-bin-vendored = "3"
