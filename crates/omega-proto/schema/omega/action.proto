syntax = "proto3";

package omega;

import "omega/state/power.proto";
import "omega/value.proto";

// Closed action vocabulary. The daemon checks action-specific capabilities
// before execution. RunCommand supports explicit shell execution.

message Action {
  oneof kind {
    LaunchApp launch_app = 1;
    RunCommand run_command = 2;
    SwitchWorkspace switch_workspace = 5;
    MoveToWorkspace move_to_workspace = 6;
    MoveToMonitor move_to_monitor = 7;
    CloseWindow close_window = 8;
    Lock lock = 9;
    Sleep sleep = 10;
    Hibernate hibernate = 11;
    Reboot reboot = 12;
    Shutdown shutdown = 13;
    Screenshot screenshot = 14;
    MediaKey media_key = 15;
    SetVolume set_volume = 16;
    SetBacklight set_backlight = 17;
    Notify notify = 18;
    InvokePlugin invoke_plugin = 19;
    ToggleFloating toggle_floating = 20;
    ToggleFullscreen toggle_fullscreen = 21;
    SetPowerProfile set_power_profile = 22;
    ConnectWifi connect_wifi = 23;
    DisconnectWifi disconnect_wifi = 24;
    ConnectBluetooth connect_bluetooth = 25;
    DisconnectBluetooth disconnect_bluetooth = 26;
    CaptureText capture_text = 27;
    RecordScreen record_screen = 28;
    WriteClipboard write_clipboard = 29;
    ClearClipboard clear_clipboard = 30;
    SetStreamVolume set_stream_volume = 31;
    SetStreamMute set_stream_mute = 32;
    SetDefaultSink set_default_sink = 33;
    SetInputMute set_input_mute = 34;
    SetInputVolume set_input_volume = 35;
  }

  // Removed settings actions; runtime settings have no owner yet.
  reserved 3, 4;
}

// Launch a desktop entry by ID without shell parsing.
message LaunchApp {
  string desktop_id = 1;
  // Literal URIs, substituted according to the desktop entry field codes.
  repeated string uris = 2;
  // Optional compositor-issued context; never inherited from daemon startup.
  string activation_token = 3;
}

// The raw shell escape hatch. Requires CAPABILITY_SPAWN.
message RunCommand {
  string command = 1;
}

// OCR a selected region into the clipboard. The recognized text is placed on
// the clipboard; nothing is returned in the action result.
message CaptureText {
  // Restrict region selection to this output, or empty for the host choice.
  string region_monitor_id = 1;
}

// Start or stop a screen recording. Start admits after spawning; completion
// acknowledges only admission, not the eventual recording.
message RecordScreen {
  oneof command {
    RecordingConfig start = 1;
    // Must be true when selected: stop the active recording.
    bool stop = 2;
  }
}

message RecordingConfig {
  // Required destination file. Recordings are never dropped in the daemon's cwd.
  string output_path = 1;
  // Capture the full screen; otherwise an interactive region selection runs first.
  bool fullscreen = 2;
  // Include desktop audio.
  bool with_audio = 3;
  // Restrict capture to this output, or empty for the host choice.
  string region_monitor_id = 4;
}

// Copy text into the clipboard.
message WriteClipboard {
  string text = 1;
}

// Remove clipboard content.
message ClearClipboard {}

// Set one application stream's volume.
message SetStreamVolume {
  uint32 stream_index = 1;
  double absolute = 2;          // 0.0 .. 1.0
}

// Mute one application stream.
message SetStreamMute {
  uint32 stream_index = 1;
  bool muted = 2;
}

// Select the default output sink by its PulseAudio name.
message SetDefaultSink {
  string sink_name = 1;
}

// Mute the default input source: `true` mutes and `false` unmutes.
message SetInputMute {
  bool muted = 1;
}

// Set the default input source's volume.
message SetInputVolume {
  double absolute = 1;          // 0.0 .. 1.0
}

message SwitchWorkspace {
  oneof target {
    // Numbered workspace in 1..=2147483647; need not currently exist.
    uint32 index = 1;
    // Literal name, without compositor selector prefixes.
    string name = 2;
    // Traverse existing workspaces in compositor order, wrapping at the ends.
    Direction direction = 3;
  }
}

message MoveToWorkspace {
  oneof target {
    uint32 index = 1;
    string name = 2;
  }
  WindowSelector window = 10;
}

message MoveToMonitor {
  string monitor_id = 1;
  WindowSelector window = 2;
}

message CloseWindow {
  WindowSelector window = 1;
}

message WindowSelector {
  oneof target {
    bool focused = 1;           // selected means true; absent selector means focused
    string app_id = 2;
    string title = 3;
  }
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_NEXT = 1;
  DIRECTION_PREVIOUS = 2;
}

// No-arg actions. Empty messages are intentional oneof cases.
message Lock {}
message Sleep {}
message Hibernate {}
message Reboot {}
message Shutdown {}

message Screenshot {
  bool fullscreen = 1;
  string region_monitor_id = 2;
  string output_path = 3;
  bool clipboard = 4;
}

message MediaKey {
  enum Key {
    MEDIA_KEY_UNSPECIFIED = 0;
    MEDIA_PLAY = 1;
    MEDIA_PAUSE = 2;
    MEDIA_PLAY_PAUSE = 3;
    MEDIA_NEXT = 4;
    MEDIA_PREVIOUS = 5;
    MEDIA_STOP = 6;
  }
  Key key = 1;
  // Absent selects the active player at execution time. Present never falls back.
  optional string player_id = 2;
}

message SetVolume {
  oneof change {
    double absolute = 1;        // 0.0 .. 1.0
    double delta = 2;           // signed
    bool toggle_mute = 3;       // must be true when selected
    bool muted = 4;             // absolute mute state; false explicitly unmutes
  }
}

message SetBacklight {
  oneof change {
    uint32 absolute_percent = 1; // 0 .. 100; invalid absolute values are refused
    int32 delta_percent = 2;
  }
}

message Notify {
  string summary = 1;
  string body = 2;
  string icon = 3;
  uint32 timeout_ms = 4;
}

// Ask the daemon to invoke another plugin's command surface.
message InvokePlugin {
  string plugin = 1;
  string command = 2;
  repeated Value args = 3;
  bytes signature = 4;
}

// Select a power profile. Platform-specific profile names are mapped by the broker.
message SetPowerProfile {
  PowerProfile profile = 1;
}

message ToggleFloating {
  WindowSelector window = 1;
}

message ToggleFullscreen {
  WindowSelector window = 1;
}

// ---- keybinds ----

message Keybind {
  string id = 1;                     // stable id for reconciler diffing
  repeated Modifier modifiers = 2;
  string key = 3;                    // key symbol; SDK wraps this in a closed enum
  Action action = 4;
  bool repeat = 5;
}

enum Modifier {
  MODIFIER_UNSPECIFIED = 0;
  MODIFIER_SUPER = 1;
  MODIFIER_CTRL = 2;
  MODIFIER_ALT = 3;
  MODIFIER_SHIFT = 4;
}

// Completion acknowledges NetworkManager activation admission. WifiState reports
// the connection outcome. Passwords must never be logged or stored in plugin records.
message ConnectWifi {
  string ssid = 1;
  string password = 2;
}
message DisconnectWifi {}

// Only a paired or connected endpoint from the Bluetooth reading may be targeted.
message ConnectBluetooth { string device_id = 1; }
message DisconnectBluetooth { string device_id = 1; }
