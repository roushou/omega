syntax = "proto3";

package omega;

import "omega/action.proto";
import "omega/event.proto";
import "omega/state.proto";
import "omega/state/plugins.proto";
import "omega/ui.proto";
import "omega/instance.proto";
import "omega/plugin.proto";
import "omega/host.proto";
import "omega/value.proto";
import "omega/storage.proto";

// Length-prefixed frame on a multiplexed Unix connection.
// Requests and responses share a stream ID; streaming results end with done = true.
// Unix peer credentials participate in authentication; message fields do not grant authority.

message Frame {
  uint64 stream_id = 1;

  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Invoke invoke = 12;
    Result result = 13;
    StatePatch state_patch = 14;
    Event event = 16;
    Ping ping = 17;
    Pong pong = 18;
    StorageUpdate storage_update = 19;
  }
}

// Initial peer handshake. Plugins authenticate with peer credentials and a
// spawn token; the manifest hash must match the daemon's copy.
// Tokenless peers with the daemon owner's UID use operator policy; other UIDs are refused.
message Hello {
  uint32 protocol_version = 1;
  string manifest_hash = 2;

  // Daemon-issued spawn token supplied through the environment.
  // Authentication checks both peer PID and token; PID reuse alone cannot transfer grants.
  string token = 3;
}

// Daemon -> plugin. Grants capabilities (read from the manifest, never from the
// plugin) and hands over the initial state mirror.
message Welcome {
  HostAssignment host_assignment = 7;
  uint32 protocol_version = 1;      // the version both will speak
  string plugin_id = 2;
  string daemon_version = 3;
  repeated Capability capabilities = 4;
  StateSnapshot state = 5;

  // Construction settings supplied once per plugin session. Changes restart the plugin.
  // RenderWidget carries instance settings layered over these plugin defaults.
  map<string, Value> config = 6;
}

// Bidirectional request, correlated by Frame.stream_id. One request per stream.
message Invoke {
  oneof op {
    ListCommands list_commands = 27;
    // ---- plugin -> daemon: daemon services ----
    StorageRequest storage = 23;
    StorageSubscribe storage_subscribe = 24;
    StorageUnsubscribe storage_unsubscribe = 25;
    StorageInspect storage_inspect = 26;
    GetState get_state = 1;
    SetState set_state = 2;
    Subscribe subscribe = 3;
    Unsubscribe unsubscribe = 4;
    Act act = 5;
    EmitEvent emit_event = 6;
    PublishView publish_view = 7;

    // ---- operator -> daemon: lifecycle ----
    RestartPlugin restart_plugin = 8;
    AdoptPlugin adopt_plugin = 9;
    ApplyShell apply_shell = 13;
    GetDeployment get_deployment = 14;
    CreateInstance create_instance = 15;
    ChangePresentation change_presentation = 16;
    InspectInstances inspect_instances = 17;
    AttachRenderer attach_renderer = 18;
    ReportPresentation report_presentation = 19;
    Interact interact = 20;
    SurfaceEvent surface_event = 21;
    SurfaceLifecycle surface_lifecycle = 22;

    // ---- daemon -> plugin: surface invocations ----
    CallCommand call_command = 10;
    RenderWidget render_widget = 11;
    RemoveWidget remove_widget = 12;
  }
}

message GetState {
  repeated string topics = 1;       // empty = all subscribed topics
}

message SetState {
  string topic = 1;                 // `plugin.<name>.<key>` only
  Value value = 2;
}

message Subscribe {
  repeated string topics = 1;
  repeated EventKind events = 2;
  // Replace the complete subscription selection when true; otherwise add topics.
  // Selection remains within the peer's authorization ceiling.
  bool replace = 3;
}

message Unsubscribe {
  repeated string topics = 1;
  repeated EventKind events = 2;
}

// Perform an action, gated by the plugin's granted capabilities.
message Act {
  Action action = 1;
}

message EmitEvent {
  CustomEvent event = 1;
}

// Publish a view for an explicit runtime instance.
// The instance identity must belong to the sending plugin's current session.
message PublishView {
  string surface_id = 1;
  ViewTree view = 2;
  reserved 3;
  InstanceRef instance = 4;
}

// Operator request to restart a plugin without changing its desired enabled state.
message RestartPlugin {
  string plugin = 1;
}

// Adopt a plugin for development. Stop supervision and return a spawn token with
// the plugin's existing manifest grants. Closing the operator connection releases
// adoption and allows normal supervision to resume.
message AdoptPlugin {
  string plugin = 1;
}

// Run a plugin's command surface.
message CallCommand {
  uint64 invocation_id = 3;
  string command = 1;
  repeated Value args = 2;
}

// Request an explicit surface instance's initial view and construction settings.
// The result carries its first view; subsequent updates use PublishView.
message RenderWidget {
  string surface_id = 1;
  reserved 2;
  InstanceRef instance = 4;
  map<string, Value> config = 3;
}

// The response, correlated by stream_id. Streaming responses send multiple
// Result frames; the last carries done = true.
message Result {
  oneof outcome {
    CommandCatalogue commands = 10;
    Error error = 1;
    StatePatch state = 2;           // GetState
    ViewTree view = 3;              // RenderWidget
    Value value = 4;                // scalar results
    CommandOutput output = 5;       // CallCommand (streaming)
    Empty ok = 6;
    DeploymentStatus deployment = 8;
    InstanceList instances = 9;
  }
  bool done = 7;
}

message CommandOutput {
  bytes chunk = 1;                  // streamed stdout/stderr
  bool is_stderr = 2;
  int32 exit_code = 3;              // set on the final frame
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

// Why the daemon refused. Closed taxonomy: a peer branches on the code, and
// the message is for humans only.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The peer is not a plugin this daemon spawned.
  ERROR_CODE_UNAUTHENTICATED = 1;
  // The plugin's manifest does not grant what the op requires, or the op names
  // a surface the plugin did not declare.
  ERROR_CODE_PERMISSION_DENIED = 2;
  // The frame is malformed for its op.
  ERROR_CODE_INVALID_ARGUMENT = 3;
  // A well-formed op this daemon does not serve yet.
  ERROR_CODE_UNIMPLEMENTED = 4;
  // The peer is who it says, but the connection cannot proceed: protocol
  // version mismatch, manifest hash mismatch, no manifest on file.
  ERROR_CODE_FAILED_PRECONDITION = 5;
  // A required service or session is unavailable.
  ERROR_CODE_UNAVAILABLE = 6;
  // A count or aggregate byte budget is exhausted.
  ERROR_CODE_RESOURCE_EXHAUSTED = 7;
  // One payload exceeds its permitted size.
  ERROR_CODE_PAYLOAD_TOO_LARGE = 8;
  // The operation deadline elapsed; external completion may be unknown.
  ERROR_CODE_DEADLINE_EXCEEDED = 9;
  ERROR_CODE_ALREADY_EXISTS = 10;
  ERROR_CODE_NOT_FOUND = 11;
  ERROR_CODE_CONFLICT = 12;
  // An admitted mutation may have committed. Read state before deciding what to do.
  ERROR_CODE_OUTCOME_UNKNOWN = 13;
}

message Empty {}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

// Remove the specified runtime instance from the plugin.
message RemoveWidget {
  string surface_id = 1;
  reserved 2;
  InstanceRef instance = 4;
}

// Explicitly apply the published generation; overwrite acknowledges external edits.
message ApplyShell { bool overwrite = 1; }


// Operator-only snapshot of live deployment progress.
message GetDeployment {}

enum ReconciliationState {
  RECONCILIATION_STATE_UNSPECIFIED = 0;
  RECONCILIATION_STATE_PENDING = 1;
  RECONCILIATION_STATE_SETTLED = 2;
}

enum ShellApplicationState {
  SHELL_APPLICATION_STATE_UNSPECIFIED = 0;
  SHELL_APPLICATION_STATE_NOT_DECLARED = 1;
  SHELL_APPLICATION_STATE_APPLYING = 2;
  SHELL_APPLICATION_STATE_APPLIED = 3;
  SHELL_APPLICATION_STATE_FAILED = 4;
}

message DeploymentStatus {
  string candidate_generation = 1;
  string accepted_generation = 2;
  string activation_error = 3;
  // The last reconciliation pass, not a health guarantee for running processes.
  ReconciliationState reconciliation = 4;
  string reconciliation_error = 5;
  // Explicit shell application can target a generation still awaiting activation.
  string shell_generation = 6;
  ShellApplicationState shell = 7;
  string shell_error = 8;
  repeated PluginStatus plugins = 9;
  // Active renderer attachments, including their reported build identity.
  repeated AttachRenderer renderers = 10;
  // Live embedded and popup placements that require a host attachment.
  repeated PlacementAttachment renderer_placements = 11;
  repeated PluginHealth plugin_health = 12;
  // Command hosts have independent process lifetimes and no surface readiness.
  repeated CommandHostStatus command_hosts = 13;
}
