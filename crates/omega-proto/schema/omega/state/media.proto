syntax = "proto3";

package omega;

// Audio output and media playback state.

message AudioState {
  double volume = 1;            // 0.0 .. 1.0
  bool muted = 2;
  string default_sink = 3;
  // Input (microphone) state, independent of output.
  double input_volume = 4;      // 0.0 .. 1.0
  bool input_muted = 5;
  string default_source = 6;
}

// Per-application audio streams, as PulseAudio reports them. Separate from
// [`AudioState`] because streams change more often than the default sink.
message AudioStreamsState {
  repeated AudioStream streams = 1;
}

message AudioStream {
  uint32 index = 1;             // pactl sink-input index, stable per stream
  string app = 2;               // the application's name, as the server knows it
  double volume = 3;            // 0.0 .. 1.0
  bool muted = 4;
}

// Available output sinks, as PulseAudio reports them. Separate from
// [`AudioState`] because the catalogue changes only when devices appear or go.
message AudioSinksState {
  repeated SinkInfo sinks = 1;
}

message SinkInfo {
  string name = 1;              // PulseAudio sink name
  string description = 2;       // human-readable description
}

// MPRIS player catalogue and active-player selection.
message MediaState {
  repeated PlayerInfo players = 1;
}

message PlayerInfo {
  string id = 1;                // the bus name's suffix: "chromium"
  string identity = 2;          // what the player calls itself: "Chromium"
  Playback playback = 3;
  string title = 4;
  string artist = 5;            // every artist, joined
  string album = 6;
  uint64 length_us = 7;         // microseconds, as MPRIS counts them

  // Whether this player is the automatic control target.
  bool active = 8;
  bool can_control = 9;
  bool can_play = 10;
  bool can_pause = 11;
  bool can_go_next = 12;
  bool can_go_previous = 13;

  // Playback position is not published; this topic carries metadata and playback status.
}

enum Playback {
  PLAYBACK_UNSPECIFIED = 0;
  PLAYBACK_PLAYING = 1;
  PLAYBACK_PAUSED = 2;
  PLAYBACK_STOPPED = 3;
}
