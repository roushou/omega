syntax = "proto3";

package omega;

// What the machine is connected through.

message NetworkState {
  bool connected = 1;
  string ssid = 2;
  string interface = 3;
  uint32 signal_percent = 4;
  NetworkType type = 5;
}

enum NetworkType {
  NETWORK_TYPE_UNSPECIFIED = 0;
  NETWORK_TYPE_ETHERNET = 1;
  NETWORK_TYPE_WIFI = 2;
  NETWORK_TYPE_CELLULAR = 3;
  NETWORK_TYPE_VPN = 4;
}

// What the machine could connect to, as the last scan found it.
//
// A topic of its own rather than a field on NetworkState: forty access points
// whose signal jitters would bump the network revision every few seconds and
// wake every indicator that only ever wanted the SSID.
message WifiState {
  repeated AccessPoint access_points = 1;
}

// One network on the air. Deduplicated by SSID — a single network is often
// several radios, and a picker showing each of them is showing the hardware
// rather than the choice.
message AccessPoint {
  string ssid = 1;
  uint32 signal_percent = 2;
  bool secured = 3;
  bool active = 4;              // the one the machine is on
}

// The Bluetooth adapter and the devices that belong to this machine.
// How much is moving over each interface, per second.
//
// Its own topic rather than fields on NetworkState, for the reason topics are
// granular at all: an SSID changes when somebody joins a network and a rate
// changes on every sample, so a widget drawing the network's name should not
// be woken twice a second by bytes it is not showing.
//
// Rates rather than counters. A counter is meaningless alone — it is the
// change between two samples — and every widget that wanted a rate would
// otherwise keep its own history and do its own subtraction, each with its
// own idea of what to do when an interface disappears.
message ThroughputState {
  repeated Link links = 1;
}

message Link {
  string interface = 1;         // "wlan0", "lo"
  uint64 rx_bytes_per_sec = 2;
  uint64 tx_bytes_per_sec = 3;
  // Since boot, for anything that wants a total rather than a rate.
  uint64 rx_bytes_total = 4;
  uint64 tx_bytes_total = 5;
}

message BluetoothState {
  // Whether the machine has an adapter at all. A desktop without one reports
  // false rather than an absent topic: BlueZ answering is a reading.
  bool available = 1;
  bool powered = 2;
  bool discovering = 3;

  // Paired or connected — the machine's own devices, not everything on the
  // air. Listing a scan would need discovery turned on, which is an action
  // the ontology does not have.
  repeated BluetoothDevice devices = 4;
}

message BluetoothDevice {
  string address = 1;           // "60:AB:D2:25:8C:49"
  string name = 2;              // the alias, which is what a person renamed it to
  bool connected = 3;
  bool paired = 4;
  string icon = 5;              // BlueZ's own icon name: "audio-headphones"

  // 0 is unknown, not empty. BlueZ reports a battery only for a connected
  // device that has one, and a device at zero percent is off and not
  // reporting anything.
  uint32 battery_percent = 6;
}

// The tunnels the machine is running through.
//
// A topic of its own rather than another arm of NetworkType: a machine is on
// Wi-Fi *and* a VPN, and an enum can only say one of those. More than one
// tunnel at a time is unusual but not wrong, so this is the list.
message VpnState {
  repeated Tunnel tunnels = 1;
}

message Tunnel {
  string name = 1;              // the connection's name
  string interface = 2;         // "wg0", "tun0"
  string kind = 3;              // "wireguard", "openvpn", …
}
