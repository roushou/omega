syntax = "proto3";

package omega;

// Network connection and interface state.

message NetworkState {
  bool connected = 1;
  string ssid = 2;
  string interface = 3;
  uint32 signal_percent = 4;
  NetworkType type = 5;
}

enum NetworkType {
  NETWORK_TYPE_UNSPECIFIED = 0;
  NETWORK_TYPE_ETHERNET = 1;
  NETWORK_TYPE_WIFI = 2;
  NETWORK_TYPE_CELLULAR = 3;
  NETWORK_TYPE_VPN = 4;
}

// Wi-Fi scan results and activation status, separate from primary connection state.
message WifiState {
  repeated AccessPoint access_points = 1;
  WifiPhase phase = 2;
  string ssid = 3;
  string failure = 4;
}

enum WifiPhase {
  WIFI_PHASE_UNSPECIFIED = 0;
  WIFI_PHASE_DISCONNECTED = 1;
  WIFI_PHASE_CONNECTING = 2;
  WIFI_PHASE_CONNECTED = 3;
  WIFI_PHASE_FAILED = 4;
}

// Visible network, deduplicated by SSID.
message AccessPoint {
  string ssid = 1;
  uint32 signal_percent = 2;
  bool secured = 3;
  bool active = 4;              // the one the machine is on
}

// Per-interface transfer rates and counters.
// Brokers derive rates from successive samples and handle counter resets.
message ThroughputState {
  repeated Link links = 1;
}

message Link {
  string interface = 1;         // "wlan0", "lo"
  uint64 rx_bytes_per_sec = 2;
  uint64 tx_bytes_per_sec = 3;
  // Cumulative counters since interface initialization or reset.
  uint64 rx_bytes_total = 4;
  uint64 tx_bytes_total = 5;
}

message BluetoothState {
  // Whether at least one Bluetooth adapter exists. A reachable service with
  // no adapter reports false; service absence is an absent topic.
  bool available = 1;
  bool powered = 2;
  bool discovering = 3;

  // Paired or connected devices only. Discovery and pairing are not supported.
  repeated BluetoothDevice devices = 4;
}

message BluetoothDevice {
  string address = 1;           // "60:AB:D2:25:8C:49"
  string name = 2;              // the alias, which is what a person renamed it to
  bool connected = 3;
  bool paired = 4;
  string icon = 5;              // BlueZ's own icon name: "audio-headphones"

  // Absence means the device does not report a battery; zero is a real reading.
  optional uint32 battery_percent = 6;
  string id = 7;               // adapter-qualified device endpoint
  bool can_connect = 8;        // paired, adapter powered, and not blocked

}

// Active tunnels, independent of the underlying network connection.
message VpnState {
  repeated Tunnel tunnels = 1;
}

message Tunnel {
  string name = 1;              // the connection's name
  string interface = 2;         // "wg0", "tun0"
  string kind = 3;              // "wireguard", "openvpn", …
}
