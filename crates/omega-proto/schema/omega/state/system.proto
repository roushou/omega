syntax = "proto3";

package omega;

// What the machine is doing with itself.

message SystemState {
  // Whole percent, across every core. Whole because that is the resolution
  // anything draws it at, and because a value carrying four decimal places
  // would be a new revision on every reading — last-value-wins only helps
  // when the value is actually the same.
  uint32 cpu_percent = 1;
  repeated uint32 core_percent = 2;

  uint64 memory_total_bytes = 3;
  // The kernel's own estimate of what a new process could have. Reported
  // rather than a "used" figure, because used is derived and every tool
  // derives it differently — the SDK subtracts, and the arithmetic is in one
  // place.
  uint64 memory_available_bytes = 4;

  uint64 swap_total_bytes = 5;
  uint64 swap_free_bytes = 6;

  double load_1 = 7;
  double load_5 = 8;
  double load_15 = 9;

  uint64 uptime_seconds = 10;
}

// Where the machine keeps things, and how much room is left.
// How hot the machine is, and what is being done about it.
//
// From hwmon, which is a lot of sensors of varying usefulness: a laptop
// reports the CPU die, the GPU edge, the SSD, the wireless card and half a
// dozen ACPI zones that all read the same number. The broker reports what it
// can read and leaves the choosing to whatever draws it.
message ThermalsState {
  repeated Sensor sensors = 1;
  repeated Fan fans = 2;
}

message Sensor {
  string chip = 1;              // "k10temp", "thinkpad", "amdgpu"
  // The sensor's own label where it has one — "CPU", "edge", "Composite" —
  // else its name in the chip, like "temp3". Chip and label together are the
  // identity; neither is unique alone.
  string label = 2;
  // Thousandths of a degree, as hwmon reports it. Signed: an outdoor sensor
  // can be below freezing, and a reading that wrapped would be worse than one
  // that is negative.
  int32 millicelsius = 3;
}

message Fan {
  string chip = 1;
  string label = 2;
  // Nought is a fan that is stopped, which is a real and interesting state —
  // unlike a temperature of nought, which is a sensor that is not there.
  uint32 rpm = 3;
}

message DiskState {
  repeated Mount mounts = 1;
}

message Mount {
  string path = 1;              // "/", "/home"
  string device = 2;            // "/dev/nvme0n1p2"
  string filesystem = 3;        // "ext4"
  uint64 total_bytes = 4;
  // What a normal user could still write. Reserved blocks are the root
  // account's, and counting them as free is how a disk reads as having room
  // right up until nothing can be saved.
  uint64 available_bytes = 5;
}
