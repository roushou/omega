syntax = "proto3";

package omega;

// CPU, memory, storage, and thermal state.

message SystemState {
  // Aggregate CPU utilization in whole percent.
  uint32 cpu_percent = 1;
  repeated uint32 core_percent = 2;

  uint64 memory_total_bytes = 3;
  // Memory available to new processes, as reported by the kernel.
  uint64 memory_available_bytes = 4;

  uint64 swap_total_bytes = 5;
  uint64 swap_free_bytes = 6;

  double load_1 = 7;
  double load_5 = 8;
  double load_15 = 9;

  uint64 uptime_seconds = 10;
}

// Temperature and fan readings from readable hwmon sensors.
message ThermalsState {
  repeated Sensor sensors = 1;
  repeated Fan fans = 2;
}

message Sensor {
  string chip = 1;              // "k10temp", "thinkpad", "amdgpu"
  // Sensor label or chip-local fallback name. Chip and label form its identity.
  string label = 2;
  // Temperature in signed millidegrees Celsius.
  int32 millicelsius = 3;
}

message Fan {
  string chip = 1;
  string label = 2;
  // Zero is a stopped fan.
  uint32 rpm = 3;
}

message DiskState {
  repeated Mount mounts = 1;
}

message Mount {
  string path = 1;              // "/", "/home"
  string device = 2;            // "/dev/nvme0n1p2"
  string filesystem = 3;        // "ext4"
  uint64 total_bytes = 4;
  // Bytes available to unprivileged users, excluding root-reserved blocks.
  uint64 available_bytes = 5;
}
