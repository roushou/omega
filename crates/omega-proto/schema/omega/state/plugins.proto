syntax = "proto3";

package omega;

import "omega/instance.proto";
import "omega/ui.proto";

// Plugin lifecycle observations.

// Daemon-owned plugin status. Plugins cannot publish their own lifecycle state.
message PluginsState {
  repeated PluginStatus plugins = 1;
}

message PluginStatus {
  string plugin = 1;
  PluginPhase phase = 2;
  uint32 restarts = 3;          // spawns after the first
  int32 last_exit_code = 4;     // -1 when it was signalled or never ran
  string detail = 5;            // the last failure, for humans
}

enum PluginPhase {
  PLUGIN_PHASE_UNSPECIFIED = 0;
  PLUGIN_PHASE_STARTING = 1;
  PLUGIN_PHASE_RUNNING = 2;
  PLUGIN_PHASE_RESTARTING = 3;    // exited; waiting out the backoff
  PLUGIN_PHASE_FAILED = 4;        // could not be spawned at all
  PLUGIN_PHASE_STOPPED = 5;       // the daemon is shutting down
}

// On-demand daemon projection, separate from process lifecycle and private trees.
message PluginHealth {
  string plugin = 1;
  PluginReadiness readiness = 2;
  repeated string surfaces = 3;
  repeated SurfaceHealth instances = 4;
}

enum PluginReadiness {
  PLUGIN_READINESS_UNSPECIFIED = 0;
  PLUGIN_READINESS_BACKGROUND = 1;
  PLUGIN_READINESS_UNPLACED = 2;
  PLUGIN_READINESS_WAITING = 3;
  // Every live instance has completed a render, including deliberately empty views.
  // This is not a claim about native visibility or renderer attachment.
  PLUGIN_READINESS_READY = 4;
  PLUGIN_READINESS_FAILED = 5;
}

message SurfaceHealth {
  InstanceRef instance = 1; // absent until instance construction starts
  string surface = 2;
  string placement = 3; // empty for transient presentations
  RenderReadiness readiness = 4;
  repeated string pending_topics = 5;
  PresentationState requested = 6;
  PresentationState observed = 7;
  string render_error = 8;
}
