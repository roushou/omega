syntax = "proto3";

package omega;

// What the compositor is showing, and what has focus.

message WorkspacesState {
  repeated WorkspaceInfo workspaces = 1;
}

// One workspace, as the compositor reports it. Distinct from the desired
// Workspace in the state document: this is reality, that is intent.
message WorkspaceInfo {
  int32 id = 1;
  string name = 2;              // "1", or whatever it was named
  string monitor_id = 3;        // "eDP-1"
  uint32 windows = 4;
  bool active = 5;              // the focused workspace
}

message WindowState {
  // Unset when nothing has focus. An empty workspace is an answer, not a
  // missing reading.
  WindowInfo focused = 1;
}

// One window. Shared by the topic and by the window events, so "the focused
// window" and "a window was focused" are one shape rather than two that can
// drift.
message WindowInfo {
  string app_id = 1;
  string title = 2;
  string workspace = 3;         // the workspace's name
  // Left empty by the Hyprland broker: the compositor reports a numeric
  // monitor here and the ontology carries names, and the workspace above
  // already says which monitor it is on.
  string monitor_id = 4;
  uint32 pid = 5;
  bool floating = 6;
  bool fullscreen = 7;
}

// Whether anybody is using the machine.
message IdleState {
  // The session manager's own hint. What counts as idle is the manager's
  // policy, not this daemon's to second-guess.
  bool idle = 1;
  // Unix seconds since it went idle, or 0 while it is not. Truncated to the
  // second, which is all the manager reports.
  uint64 idle_since = 2;
  // Whether the session is locked. A locked session is not necessarily idle
  // and an idle one is not necessarily locked.
  bool locked = 3;
}
