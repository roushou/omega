syntax = "proto3";

package omega;

// Workspace, focus, and session input state.

message WorkspacesState {
  repeated WorkspaceInfo workspaces = 1;
}

// Observed workspace state, distinct from desired Workspace configuration.
message WorkspaceInfo {
  int32 id = 1;
  string name = 2;              // "1", or whatever it was named
  string monitor_id = 3;        // "eDP-1"
  uint32 windows = 4;
  bool active = 5;              // the focused workspace
}

message WindowState {
  // Unset when nothing has focus. An empty workspace is an answer, not a
  // missing reading.
  WindowInfo focused = 1;
}

// Window metadata shared by state topics and transition events.
message WindowInfo {
  string app_id = 1;
  string title = 2;
  string workspace = 3;         // the workspace's name
  // Hyprland leaves this empty. Resolve the output through the workspace reading.
  string monitor_id = 4;
  uint32 pid = 5;
  bool floating = 6;
  bool fullscreen = 7;
}

// Session idle and lock state.
message IdleState {
  // Idle hint reported by the session manager.
  bool idle = 1;
  // Unix seconds when idle began, or zero if no idle timestamp is available.
  uint64 idle_since = 2;
  // Lock state, independent of idle state.
  bool locked = 3;
}

// Main keyboard and active layout.
message InputState {
  // Keyboard marked as main by the compositor.
  string keyboard = 1;          // the device's name
  string layout = 2;            // "us", as xkb spells it
  string keymap = 3;            // "English (US)", as a person reads it
}
