syntax = "proto3";

package omega;

// Local date and time.

// Local calendar fields and Unix timestamp with minute precision.
// The daemon applies time-zone rules. Second-resolution updates are unsupported.
message TimeState {
  int64 unix_seconds = 1;       // truncated to the minute
  string zone = 2;              // "Europe/Paris", or "UTC" where unknown
  int32 utc_offset_seconds = 3;

  int32 year = 4;
  uint32 month = 5;             // 1..12
  uint32 day = 6;               // 1..31
  uint32 hour = 7;              // 0..23
  uint32 minute = 8;            // 0..59
  uint32 weekday = 9;           // 0 = Sunday
}
