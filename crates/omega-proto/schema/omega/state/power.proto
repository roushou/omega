syntax = "proto3";

package omega;

// What the machine is running on.

message BatteryState {
  double level = 1;             // 0.0 .. 1.0
  bool charging = 2;
  uint32 seconds_to_empty = 3;
  uint32 seconds_to_full = 4;
}

message PowerState {
  // Whether the machine is running on mains rather than its battery. From
  // the same broker as the battery: it is one power supply subsystem, and two
  // brokers reading it would be two answers to one question.
  bool on_ac = 1;

  // 2 was `load_percent`, which is not a power-supply reading — it is the
  // kernel's own load average, and it belongs in a `system` topic beside CPU
  // and memory rather than here. Nothing ever filled it.
  reserved 2;
}
