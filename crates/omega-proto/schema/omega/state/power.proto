syntax = "proto3";

package omega;

// What the machine is running on.

message BatteryState {
  double level = 1;             // 0.0 .. 1.0
  bool charging = 2;
  uint32 seconds_to_empty = 3;
  uint32 seconds_to_full = 4;
}

message PowerState {
  // Whether the machine is running on mains rather than its battery. From
  // the same broker as the battery: it is one power supply subsystem, and two
  // brokers reading it would be two answers to one question.
  bool on_ac = 1;

  // 2 was `load_percent`, which is not a power-supply reading — it is the
  // kernel's own load average, and it belongs in a `system` topic beside CPU
  // and memory rather than here. Nothing ever filled it.
  reserved 2;
}

// The batteries of things plugged into the machine, rather than the machine's
// own: a mouse, a keyboard, a headset.
message PeripheralsState {
  repeated Peripheral devices = 1;
}

message Peripheral {
  string id = 1;                // stable across reconnects: UPower's own path
  string model = 2;             // "Logitech G Pro"
  PeripheralKind kind = 3;
  uint32 percent = 4;
  bool charging = 5;
}

// UPower knows thirty kinds of device. These are the ones a bar draws
// differently; everything else is `OTHER`, which is honest — a widget can
// still show the model and the percentage.
enum PeripheralKind {
  PERIPHERAL_KIND_UNSPECIFIED = 0;
  PERIPHERAL_KIND_MOUSE = 1;
  PERIPHERAL_KIND_KEYBOARD = 2;
  PERIPHERAL_KIND_HEADSET = 3;
  PERIPHERAL_KIND_GAMING_INPUT = 4;
  PERIPHERAL_KIND_TABLET = 5;
  PERIPHERAL_KIND_PHONE = 6;
  PERIPHERAL_KIND_OTHER = 7;
}
