syntax = "proto3";

package omega;

// Battery, external power, and profile state.

message BatteryState {
  double level = 1;             // 0.0 .. 1.0
  bool charging = 2;
  uint32 seconds_to_empty = 3;
  uint32 seconds_to_full = 4;
}

// External power state, independent of battery presence and charge updates.
message MainsState {
  // Whether external power is connected.
  bool connected = 1;

  // Reserved field number; do not reuse.
  reserved 2;
}

// Power profiles reported by power-profiles-daemon.
message PowerProfileState {
  PowerProfile active = 1;

  // Profiles supported by this machine.
  repeated PowerProfile available = 2;

  // Performance limitation reason, or empty if none is reported.
  string degraded = 3;
}

enum PowerProfile {
  POWER_PROFILE_UNSPECIFIED = 0;
  POWER_PROFILE_SAVER = 1;
  POWER_PROFILE_BALANCED = 2;
  POWER_PROFILE_PERFORMANCE = 3;
}

// Peripheral batteries, excluding the system battery.
message PeripheralsState {
  repeated Peripheral devices = 1;
}

message Peripheral {
  string id = 1;                // stable across reconnects: UPower's own path
  string model = 2;             // "Logitech G Pro"
  PeripheralKind kind = 3;
  uint32 percent = 4;
  bool charging = 5;
}

// Supported peripheral device kinds; unrecognized kinds map to OTHER.
enum PeripheralKind {
  PERIPHERAL_KIND_UNSPECIFIED = 0;
  PERIPHERAL_KIND_MOUSE = 1;
  PERIPHERAL_KIND_KEYBOARD = 2;
  PERIPHERAL_KIND_HEADSET = 3;
  PERIPHERAL_KIND_GAMING_INPUT = 4;
  PERIPHERAL_KIND_TABLET = 5;
  PERIPHERAL_KIND_PHONE = 6;
  PERIPHERAL_KIND_OTHER = 7;
}
