syntax = "proto3";

package omega;

// Display and backlight state.

message BacklightState {
  // Brightness percentage in 0..100, converted from the device scale by the broker.
  uint32 percent = 1;

  // Reserved field number; do not reuse.
  reserved 2;
}

// Observed display state. Desired layouts use Monitor in document.proto.
message MonitorsState {
  repeated MonitorInfo monitors = 1;
}

message MonitorInfo {
  string id = 1;            // "eDP-1"
  bool connected = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 refresh_mhz = 5;
  int32 x = 6;
  int32 y = 7;
  float scale = 8;
  bool primary = 9;
}
