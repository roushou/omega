syntax = "proto3";

package omega;

// Shared display and window payloads used by state topics and events.
import "omega/state/display.proto";
import "omega/state/session.proto";
import "omega/value.proto";

// State-transition and custom events delivered to declared subscribers.
// EventKind identifies the payload in the detail oneof.

message Event {
  uint64 id = 1;
  uint64 timestamp_ns = 2;
  EventKind kind = 3;

  oneof detail {
    MonitorEvent monitor = 10;
    WindowEvent window = 11;
    PowerEvent power = 12;
    NotificationEvent notification = 13;
    ScheduleFired schedule = 14;
    KeybindTriggered keybind = 15;
    CustomEvent custom = 16;
    IdleEvent idle = 17;
    ClipboardEvent clipboard = 18;
  }
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // monitor
  EVENT_MONITOR_CONNECTED = 1;
  EVENT_MONITOR_DISCONNECTED = 2;
  EVENT_MONITOR_MODE_CHANGED = 3;
  // window
  EVENT_WINDOW_OPENED = 10;
  EVENT_WINDOW_CLOSED = 11;
  EVENT_WINDOW_FOCUSED = 12;
  EVENT_WINDOW_MOVED = 13;
  EVENT_WINDOW_TITLED = 14;
  // power
  EVENT_LID_CLOSED = 20;
  EVENT_LID_OPENED = 21;
  EVENT_AC_PLUGGED = 22;
  EVENT_AC_UNPLUGGED = 23;
  EVENT_BATTERY_LOW = 24;
  EVENT_BATTERY_CRITICAL = 25;
  EVENT_SUSPEND = 26;
  EVENT_RESUME = 27;
  // idle
  EVENT_IDLE_ENTERED = 28;
  EVENT_IDLE_EXITED = 29;
  // notification
  EVENT_NOTIFICATION_DISMISSED = 30;
  EVENT_NOTIFICATION_CLICKED = 31;
  EVENT_NOTIFICATION_ACTION_INVOKED = 32;
  // schedule / keybind
  EVENT_SCHEDULE_FIRED = 40;
  EVENT_KEYBIND_TRIGGERED = 41;
  // clipboard
  EVENT_CLIPBOARD_CHANGED = 42;
  // plugin-emitted
  EVENT_CUSTOM = 50;
}

message MonitorEvent {
  MonitorInfo monitor = 1;
}

message WindowEvent {
  WindowInfo window = 1;
}

message PowerEvent {
  // Power-transition identity is carried by kind; battery crossings carry the
  // level that crossed, as a fraction 0..1. Other power events leave it unset.
  double battery_percent = 1;
}

// Idle transitions carry no payload; IdleState carries the duration.
message IdleEvent {}

// Clipboard changes carry no payload; ClipboardState carries the content.
message ClipboardEvent {}

message NotificationEvent {
  uint32 notification_id = 1;
  string action_id = 2;         // for action-invoked
  string reply = 3;             // for replies
}

message ScheduleFired {
  string schedule_id = 1;
}

message KeybindTriggered {
  string keybind_id = 1;
}

// Plugin-emitted, namespaced by plugin. The only event kind with open semantics.
message CustomEvent {
  string plugin = 1;
  string name = 2;
  Value payload = 3;
}
