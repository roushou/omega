syntax = "proto3";
import "omega/host.proto";

package omega;

import "omega/action.proto";
import "omega/event.proto";
import "omega/value.proto";
import "omega/instance.proto";

// Desired desktop state computed by the configuration plane.
// Stable entity IDs identify changes during reconciliation; observed state uses separate messages.

message StateDocument {
  repeated CommandHostConfig command_hosts = 13;
  uint64 revision = 1;                  // from omega.lock

  repeated Monitor monitors = 2;
  repeated Workspace workspaces = 3;
  repeated Bar bars = 4;
  repeated Keybind keybinds = 5;
  repeated Setting settings = 6;
  repeated Schedule schedules = 7;
  repeated Policy policies = 8;
  repeated PluginRef plugins = 9;
  repeated EnvironmentVariable environment = 10;

  // Omarchy-specific declaration interpreted by omega-omarchy, not by plugins.
  string shell_json = 11;
  repeated ConfiguredPresentation presentations = 12;
}

// Desired display layout. Distinct from MonitorInfo (actual state).
message Monitor {
  string id = 1;                // "eDP-1"
  bool enabled = 2;
  int32 x = 3;
  int32 y = 4;
  float scale = 5;
  uint32 refresh_mhz = 6;
  bool primary = 7;
}

message Workspace {
  uint32 index = 1;
  string name = 2;
  string monitor_id = 3;
  bool persistent = 4;
}

message Bar {
  string id = 1;
  string monitor_id = 2;
  Edge edge = 3;
  repeated Module modules = 4;
}

enum Edge {
  EDGE_UNSPECIFIED = 0;
  EDGE_TOP = 1;
  EDGE_BOTTOM = 2;
  EDGE_LEFT = 3;
  EDGE_RIGHT = 4;
}

message Module {
  string id = 1;
  oneof kind {
    ClockModule clock = 2;
    BatteryModule battery = 3;
    WorkspaceModule workspaces = 4;
    TrayModule tray = 5;
    WidgetModule widget = 6;   // a widget plugin, instantiated
  }
}

message ClockModule {
  string format = 1;            // strftime
}

message BatteryModule {
  bool show_percent = 1;
}

message WorkspaceModule {}
message TrayModule {}

message WidgetModule {
  string plugin = 1;              // plugin name from its manifest
  map<string, Value> config = 2;

  // Widget surface ID. Empty selects the plugin's sole widget surface.
  string surface = 3;

  // Popup surface ID anchored to this placement. Empty means no popup.
  string panel = 4;
}

message Setting {
  string id = 1;
  oneof kind {
    NightLightSetting night_light = 2;
    IdleSetting idle = 3;
    ThemeSetting theme = 4;
    CursorSetting cursor = 5;
    Value custom = 6;           // open extension
  }
}

message NightLightSetting {
  bool enabled = 1;
  uint32 temperature_k = 2;     // e.g. 3500
}

message IdleSetting {
  uint32 timeout_sec = 1;
  oneof on_idle {
    Lock lock = 2;
    Sleep sleep = 3;
    RunCommand run = 4;
  }
}

message ThemeSetting {
  string name = 1;
  map<string, Value> overrides = 2;
}

message CursorSetting {
  string theme = 1;
  uint32 size = 2;
}

// Recurring schedule. Every tick emits EVENT_SCHEDULE_FIRED and executes
// the action if one is present.
message Schedule {
  string id = 1;

  // Elapsed-time cadence: `every <n><s|m|h|d>`, with n > 0. Cron is unsupported.
  string cadence = 2;

  Action action = 3;
}

// Wires events to a policy plugin (the runtime plane's imperative half).
message Policy {
  string id = 1;
  string plugin = 2;
  repeated EventKind events = 3;
  map<string, Value> config = 4;
}

// A plugin enabled in the runtime plane.
message PluginRef {
  string name = 1;
  bool enabled = 2;
  map<string, Value> config = 3;
}

message EnvironmentVariable {
  string key = 1;
  string value = 2;
}

message ConfiguredPresentation {
  string id = 1;
  string plugin = 2;
  string surface = 3;
  map<string, Value> config = 4;
  Presentation presentation = 5;
}
