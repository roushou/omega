syntax = "proto3";

package omega;

import "omega/state/display.proto";
import "omega/state/applications.proto";
import "omega/state/clipboard.proto";
import "omega/state/media.proto";
import "omega/state/network.proto";
import "omega/state/notifications.proto";
import "omega/state/power.proto";
import "omega/state/session.proto";
import "omega/state/system.proto";
import "omega/state/time.proto";
import "omega/state/plugins.proto";
import "omega/value.proto";

// Revisioned system topics and plugin records replicated by the daemon.
// Domain payloads are defined under state/; this envelope identifies their topic.

// Topic address: a validated system name or `plugin.<name>.<key>`.
// An unset payload reports explicit absence. This differs from an unreported
// topic and satisfies required-reading startup gates.
message StateTopic {
  string topic = 1;
  uint64 revision = 2;          // monotonic per topic; drives coalescing

  // System topic tags use 10..99. Reserved tags must not be reused.
  reserved 20;

  oneof value {
    BatteryState battery = 10;
    NetworkState network = 11;
    AudioState audio = 12;
    BacklightState backlight = 13;
    MainsState mains = 14;
    MonitorsState monitors = 15;
    PluginsState plugins = 16;
    TimeState time = 17;
    WifiState wifi = 18;
    WorkspacesState workspaces = 19;
    WindowState window = 21;
    MediaState media = 22;
    BluetoothState bluetooth = 23;
    SystemState system = 24;
    IdleState idle = 25;
    PeripheralsState peripherals = 26;
    InputState input = 27;
    VpnState vpn = 28;
    DiskState disk = 29;
    PowerProfileState power_profile = 30;
    ThroughputState throughput = 31;
    ThermalsState thermals = 32;
    ApplicationsState applications = 33;
    ClipboardState clipboard = 34;
    AudioStreamsState audio_streams = 35;
    NotificationsState notifications = 36;
    AudioSinksState audio_sinks = 37;

    Value generic = 1000;       // plugin keyspace + forward-compatible topics
  }
}

// Batch of topic updates. Unchanged values do not advance revisions.
message StatePatch {
  repeated StateTopic topics = 1;
}

// The full mirror handed to a plugin on connect.
message StateSnapshot {
  repeated StateTopic topics = 1;
}
