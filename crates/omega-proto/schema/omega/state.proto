syntax = "proto3";

package omega;

import "omega/state/display.proto";
import "omega/state/media.proto";
import "omega/state/network.proto";
import "omega/state/power.proto";
import "omega/state/units.proto";
import "omega/value.proto";

// The system state topics. Strongly typed: this is the ontology. The daemon
// owns all state and replicates it into units as last-value-wins patches;
// reads in the SDK are local memory reads (omega.battery.level).
//
// The payloads live under state/, one file per domain. The oneof below stays
// here because it *is* the ontology: what a topic can carry is one list, and
// splitting that would be splitting the thing this schema exists to fix.

// One topic value. "topic" is the address: "battery", "network", "audio",
// "backlight", "power", "display", "units", or "unit.<name>.<key>" for
// unit-owned data.
//
// A topic published with no value is the daemon saying there is nothing to
// report — no battery in the machine, no adapter, the broker is down. That is
// an answer, and distinct from never having published the topic at all, which
// is what a unit waits on before its first render.
message StateTopic {
  string topic = 1;
  uint64 revision = 2;          // monotonic per topic; drives coalescing

  // Typed topics take 10..99 — the ontology is meant to grow into that
  // block, so the escape hatch sits well past it rather than three numbers
  // away. 20 is reserved because `generic` was there before the block was.
  reserved 20;

  oneof value {
    BatteryState battery = 10;
    NetworkState network = 11;
    AudioState audio = 12;
    BacklightState backlight = 13;
    PowerState power = 14;
    DisplayState display = 15;
    UnitsState units = 16;

    Value generic = 1000;       // unit keyspace + forward-compatible topics
  }
}

// A coalesced batch of topic updates. The daemon collapses bursts per topic
// before pushing, so a unit only ever sees the latest value.
message StatePatch {
  repeated StateTopic topics = 1;
}

// The full mirror handed to a unit on connect.
message StateSnapshot {
  repeated StateTopic topics = 1;
}
