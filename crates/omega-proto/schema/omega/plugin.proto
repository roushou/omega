syntax = "proto3";

package omega;

import "omega/event.proto";
import "omega/host.proto";
import "omega/storage.proto";

// Plugin manifests, endpoint kinds, and capabilities.

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_STATE_READ = 1;
  CAPABILITY_STATE_WRITE = 2;            // plugin keyspace only
  CAPABILITY_SPAWN = 3;                  // RunCommand / LaunchApp
  CAPABILITY_SYSTEM_CONTROL = 4;         // lock/sleep/reboot/shutdown
  CAPABILITY_MEDIA = 5;
  CAPABILITY_AUDIO = 6;
  CAPABILITY_BACKLIGHT = 7;
  CAPABILITY_NOTIFY = 8;
  CAPABILITY_SCREENSHOT = 9;
  CAPABILITY_CLIPBOARD = 10;
  CAPABILITY_NETWORK = 11;
  CAPABILITY_BLUETOOTH = 12;
}

// Supported UI surface kinds.
enum SurfaceKind {
  SURFACE_KIND_UNSPECIFIED = 0;
  SURFACE_KIND_WIDGET = 1;
  reserved 2;
  reserved "SURFACE_KIND_COMMAND";
  // Headless, session-scoped: no render, no placement, no presentation.
  SURFACE_KIND_SERVICE = 3;
}

// Build-time plugin declarations and handshake identity.
// The plugin emits its manifest; the daemon loads the staged copy before spawning.
// Hello carries SHA-256 over canonical bytes: repeated fields sorted and
// deduplicated, then protobuf-encoded in tag order.
message Manifest {
  HostKind host_kind = 10;
  string name = 1;
  string version = 2;
  repeated Capability capabilities = 3;
  repeated Surface surfaces = 4;
  repeated CommandEndpoint commands = 7;

  // Validated system-topic or plugin-record addresses.
  repeated string state_topics = 5;

  repeated EventKind events = 6;
  repeated StorageDescriptor storage = 8;
  repeated CommandDependency command_dependencies = 9;
}

// One declared UI surface.
message Surface {
  string id = 1;
  SurfaceKind kind = 2;
}

// Transport-neutral command value shapes. Opaque inputs require an explicit adapter.
message CommandType {
  enum Kind {
    OPAQUE = 0;
    UNIT = 1;
    BOOLEAN = 2;
    INTEGER = 3;
    NUMBER = 4;
    TEXT = 5;
    LIST = 6;
    OPTIONAL = 7;
    RECORD = 8;
    CHOICE = 9;
  }
  Kind kind = 1;
  repeated CommandField fields = 2;
  CommandType element = 3;
  repeated string choices = 4;
  optional double minimum = 5;
  optional double maximum = 6;
  string identity = 7;
}
message CommandField {
  string name = 1;
  CommandType value = 2;
}
message CommandEndpoint {
  string id = 1;
  CommandType input = 2;
  CommandType output = 3;
  string description = 4;
}
message CommandDependency {
  reserved 1;
  reserved "plugin";
  string command = 2;
  bytes signature = 3;
}
message ListCommands {}
message CommandCatalogue { repeated AvailableCommand entries = 1; repeated CommandHostStatus hosts = 2; }
message AvailableCommand {
  string plugin = 1;
  CommandEndpoint endpoint = 2;
  bytes signature = 3;
  bool available = 4;
  repeated CommandExecution executions = 5;
}

// Bounded, argument-free execution diagnostics for an isolated command provider.
message CommandExecution {
  uint64 invocation_id = 1;
  uint64 process_id = 2;
  string phase = 3;
  uint64 queue_ms = 4;
  uint64 execution_ms = 5;
  string outcome = 6;
  string command = 7;
}

enum CommandHostPhase {
  COMMAND_HOST_PHASE_UNSPECIFIED = 0;
  COMMAND_HOST_PHASE_IDLE = 1;
  COMMAND_HOST_PHASE_STARTING = 2;
  COMMAND_HOST_PHASE_RUNNING = 3;
  COMMAND_HOST_PHASE_STOPPING = 4;
  COMMAND_HOST_PHASE_BACKOFF = 5;
  COMMAND_HOST_PHASE_FAILED = 6;
}

message CommandHostStatus {
  string id = 1;
  string lifetime = 2;
  repeated CommandProcessStatus processes = 3;
  uint32 concurrency = 4;
  uint32 queue_capacity = 5;
  CommandHostPhase phase = 6;
  HostStart start = 7;
  // Eligibility, not a promise of an automatic retry for on-demand hosts.
  optional uint64 retry_after_ms = 8;
  // Most recent startup failure; cleared by a successful handshake. Bounded to 512 characters.
  string startup_error = 9;
  // Counts include admitted work draining from older generations of this host.
  uint32 queued_calls = 10;
  uint32 active_calls = 11;
  // Up to five failures, newest completion first, from the bounded execution history.
  repeated CommandExecution recent_failures = 12;
}
message CommandProcessStatus {
  uint64 id = 1;
  string phase = 2;
}
