syntax = "proto3";

package omega;

import "omega/event.proto";
import "omega/storage.proto";

// Plugin manifests, endpoint kinds, and capabilities.

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_STATE_READ = 1;
  CAPABILITY_STATE_WRITE = 2;            // plugin keyspace only
  CAPABILITY_SPAWN = 3;                  // RunCommand / LaunchApp
  CAPABILITY_SYSTEM_CONTROL = 4;         // lock/sleep/reboot/shutdown
  CAPABILITY_MEDIA = 5;
  CAPABILITY_AUDIO = 6;
  CAPABILITY_BACKLIGHT = 7;
  CAPABILITY_NOTIFY = 8;
  CAPABILITY_SCREENSHOT = 9;
  CAPABILITY_CLIPBOARD = 10;
  CAPABILITY_NETWORK = 11;
  CAPABILITY_BLUETOOTH = 12;
}

// Supported UI surface kinds.
enum SurfaceKind {
  SURFACE_KIND_UNSPECIFIED = 0;
  SURFACE_KIND_WIDGET = 1;
  reserved 2;
  reserved "SURFACE_KIND_COMMAND";
}

// Build-time plugin declarations and handshake identity.
// The plugin emits its manifest; the daemon loads the staged copy before spawning.
// Hello carries SHA-256 over canonical bytes: repeated fields sorted and
// deduplicated, then protobuf-encoded in tag order.
message Manifest {
  string name = 1;
  string version = 2;
  repeated Capability capabilities = 3;
  repeated Surface surfaces = 4;
  repeated CommandEndpoint commands = 7;

  // Validated system-topic or plugin-record addresses.
  repeated string state_topics = 5;

  repeated EventKind events = 6;
  repeated StorageDescriptor storage = 8;
}

// One declared UI surface.
message Surface {
  string id = 1;
  SurfaceKind kind = 2;
}

message CommandEndpoint { string id = 1; }
