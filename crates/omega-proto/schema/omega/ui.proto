syntax = "proto3";

package omega;

import "omega/value.proto";

// Declarative view nodes with stable keys for renderer reconciliation.
// Supported kinds are defined by the protocol node table; unknown wire kinds render nothing.

message ViewTree {
  ViewNode root = 1;
  uint64 revision = 2;          // monotonic per widget surface
}

message ViewNode {
  string key = 1;               // stable per position, for the reconciler
  string type = 2;              // "box" | "text" | "button" | "progress" | "icon" | ...
  map<string, Value> props = 3;
  repeated ViewNode children = 4;

  // Bindings indexed by event name, such as press, change, submit, or activate.
  // Unknown event names are ignored. Properties and bindings use separate maps.
  map<string, Bind> events = 5;
}

// A declared command or instance-local message binding.
// Command targets belong to the publishing unit. Fixed arguments retain order;
// a control value is appended on interaction. Local bindings use local_id and no arguments.
message Bind {
  string command = 1;
  repeated Value args = 2;
  uint64 local = 3; // mutually exclusive with command; opaque plugin-owned binding
}
