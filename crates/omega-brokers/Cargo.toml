[package]
name = "omega-brokers"
version.workspace = true
categories = ["os::linux-apis", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["desktop", "dbus", "upower", "pipewire", "hyprland"]
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The subsystems Omega brokers: state out, actions in, one connection each."

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3.34", default-features = false }
omega-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "net", "io-util", "process"] }
tracing.workspace = true
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
