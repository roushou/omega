[package]
name = "omega-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Write an Omega plugin: declare what you need by holding it, and draw."

[lints]
workspace = true

# `omega` is taken on crates.io by an unrelated crate, so the package is
# `omega-rs` and the library keeps the name everything reads and writes:
# `use omega::…`, unchanged in every config, template and doc.
[lib]
name = "omega"

[dependencies]
omega-derive = { path = "../omega-derive", version = "0.1.0" }
omega-proto.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros"] }

[dev-dependencies]
omega-proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
