[package]
name = "omega-rs"
version.workspace = true
categories = ["gui", "os::linux-apis", "api-bindings"]
edition.workspace = true
homepage.workspace = true
keywords = ["omarchy", "hyprland", "desktop", "widget", "plugin"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Write an Omega plugin: declare what you need by holding it, and draw."

[lints]
workspace = true

# Published as omega-rs; consumers import the library as omega.
[lib]
name = "omega"

[dependencies]
omega-derive = { path = "../omega-derive", version = "0.3.9" }
omega-keyboard.workspace = true
omega-proto.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros"] }

[dev-dependencies]
# Enable protobuf JSON for standalone SDK wire-format tests.
omega-proto = { workspace = true, features = ["json"] }
rustix = { version = "1", features = ["time"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[example]]
name = "launcher"
test = true
