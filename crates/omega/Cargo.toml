[package]
name = "omega-rs"
version.workspace = true
categories = ["gui", "os::linux-apis", "api-bindings"]
edition.workspace = true
homepage.workspace = true
keywords = ["omarchy", "hyprland", "desktop", "widget", "plugin"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Write an Omega plugin: declare what you need by holding it, and draw."

[lints]
workspace = true

# `omega` is taken on crates.io by an unrelated crate, so the package is
# `omega-rs` and the library keeps the name everything reads and writes:
# `use omega::…`, unchanged in every config, template and doc.
[lib]
name = "omega"

[dependencies]
omega-derive = { path = "../omega-derive", version = "0.1.0" }
omega-proto.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros"] }

[dev-dependencies]
# `json`: the view tests compare a rendered tree against protobuf JSON. Without
# it here, `cargo test -p omega-rs` fails on its own and passes from the
# workspace, which is the feature unification catching somebody out rather
# than telling them anything.
omega-proto = { workspace = true, features = ["json"] }
rustix = { version = "1", features = ["time"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
