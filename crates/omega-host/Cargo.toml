[package]
name = "omega-host"
version.workspace = true
categories = ["filesystem", "config", "os::linux-apis"]
edition.workspace = true
homepage.workspace = true
keywords = ["omega", "toml", "filesystem", "layout"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Omega's host side: the filesystem layout, atomic writes, and TOML documents."

[lints]
workspace = true

[features]
default = []
watch = ["dep:notify", "dep:tokio", "dep:tracing"]

[dependencies]
libc = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"], optional = true }
omega-proto.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"], optional = true }
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = { workspace = true, optional = true }

serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }
