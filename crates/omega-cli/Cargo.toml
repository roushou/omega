[package]
name = "omega-cli"
version.workspace = true
categories = ["command-line-utilities", "config", "os::linux-apis"]
edition.workspace = true
homepage.workspace = true
keywords = ["omarchy", "hyprland", "desktop", "dotfiles", "config"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "The `omega` command line: scaffold, build, run, and inspect a configuration."

[lints]
workspace = true

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7.6", features = ["fancy-no-backtrace"] }
omega-brokers.workspace = true
omega-daemon = { path = "../omega-daemon", version = "0.2.1" }
omega-document.workspace = true
omega-host.workspace = true
omega-proto = { workspace = true, features = ["json"] }
omega-renderer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "io-util",
  "net",
  "fs",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "omega_cli"
path = "src/lib.rs"

[[bin]]
name = "omega"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Reading this repository's own manifests, which use `workspace = true`
# inheritance that the generated-manifest model does not describe.
toml = "1"
