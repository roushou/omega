[package]
name = "omega-daemon"
version.workspace = true
categories = ["os::linux-apis", "asynchronous"]
edition.workspace = true
homepage.workspace = true
keywords = ["desktop", "daemon", "supervisor", "wayland", "ipc"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "The Omega daemon: trust boundary, state owner, unit supervisor, and reconciler."

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
omega-brokers.workspace = true
omega-document.workspace = true
omega-host.workspace = true
omega-proto = { workspace = true, features = ["json"] }
prost = "0.14"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "signal",
  "io-util",
  "sync",
  "process",
] }
toml = "1"
tracing.workspace = true

[dev-dependencies]
omega-document.workspace = true
# `start_paused`: backoff pacing and keepalive timeouts are asserted on a
# clock the test moves, not waited out.
tokio = { workspace = true, features = ["test-util"] }
